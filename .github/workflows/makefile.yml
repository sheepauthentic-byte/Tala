name: Compile iOS Dylib (Sheepct Makefile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    # QUAN TRỌNG: Phải dùng macos-latest để có sẵn Apple SDK (UIKit, Foundation)
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile Dynamic Library with Makefile
      run: |
        make clean
        make

    - name: Upload Artifact (.dylib)
      uses: actions/upload-artifact@v4
      with:
        name: SheepctMod-Dylib
        path: libSheepctMod.dylib

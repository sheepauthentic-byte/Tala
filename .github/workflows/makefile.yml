name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone Dobby Dependency
        run: git clone --depth=1 https://github.com/jmpews/Dobby.git Dobby

      - name: Build Dylib
        run: |
          make clean
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libSheepctMod.dylib
          path: libSheepctMod.dylib

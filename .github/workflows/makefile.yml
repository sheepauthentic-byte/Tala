name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dobby Hook Library
      run: |
        git clone https://github.com/jmpews/Dobby.git dobby

    - name: Build Dylib via Makefile
      run: |
        make

    - name: Upload Built Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibSheepctMod
        path: LibSheepctMod.dylib

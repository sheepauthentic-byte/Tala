name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Developer Tools (Xcode command line tools)
      run: xcode-select --install || true

    - name: Build Dynamic Library via Makefile
      run: |
        make clean
        make all

    - name: Verify built artifact
      run: |
        file build/libSheepctMod.dylib
        ls -la build/

    - name: Upload Build Artifact (.dylib)
      uses: actions/upload-artifact@v4
      with:
        name: libSheepctMod-dylib
        path: build/libSheepctMod.dylib
